services:

  sesame-db:
    image: "postgres:latest"
    container_name: sesame-db
    env_file:
      - path: "./backend/environment/.env.production"
    environment:
      POSTGRES_USER: ${POSTGRES_SESAME_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SESAME_PASSWORD}
      #POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB}, ${POSTGRES_SESAME_DB}
      #PGDATA: /data/postgres
      #PGPORT: ${PGPORT}
    command:
      - postgres
      - -c
      - ssl=off   
    ports:
      - ${PGPORT}:${PGPORT}
    networks:
      - sesame-network
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      #- ./dumps:/docker-entrypoint-initdb.d/dumps
      - ./create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - pgdata:/var/lib/postgresql         
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_SESAME_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  sesame-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        shared-context: ./shared
    container_name: sesame-frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules    
    ports:
      - "3000:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - sesame-network
    depends_on:
      sesame-db:
        condition: service_healthy      

  sesame-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        shared-context: ./shared      
    container_name: sesame-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules   
    ports:
      - "3001:3001"
    depends_on:
      sesame-db:
        condition: service_healthy
    networks:
      - sesame-network

  sesame-pgadmin:
    image: dpage/pgadmin4:9.16
    env_file:
      - path: ./backend/environment/.env.development 
    container_name: sesame-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - sesame-network      
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - sesame-db
    restart: always      

  sesame-db-migration:
    container_name: sesame-db-migration
    build:
      context: ./backend
      additional_contexts:
        shared-context: ./shared      
    command:
      [
        "./wait-for-it/wait-for-it.sh",
        "${POSTGRES_SESAME_HOST}:${PGPORT}",
        "--",
        "npm",
        "run",
        "create-migrations"
      ]
    links:
      - sesame-db
    depends_on:
      - sesame-db
    env_file: "./backend/environment/.env.production"
    environment:
      - DB_HOST=sesame-db

  sesame-supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: sesame-supertokens
    depends_on:
      sesame-db-migration:
        condition: service_completed_successfully
      sesame-db:
        condition: service_healthy
    ports:
      - 3567:3567
    env_file:
      - path: ./backend/environment/.env.production      
    environment:
      POSTGRESQL_CONNECTION_URI: ${PG_CONNECTION_STRING_SUPER_TOKENS}
    networks:
      - sesame-network
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c "exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello""
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sesame-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data: 
  frontend_node_modules:
  backend_node_modules:   